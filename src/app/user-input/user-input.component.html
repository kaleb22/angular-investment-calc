<form (ngSubmit)="onSubmit()">
  <div class="input-group">
    <p>
      <label for="initial-invest">Initial Investment</label>
      <input
        id="initial-invest"
        name="initial-invest"
        type="number"
        [(ngModel)]="initialValue"
      />
    </p>
    <p>
      <label for="annual-invest">Annual Investment</label>
      <input
        id="annual-invest"
        name="annual-invest"
        type="number"
        [(ngModel)]="annualValue"
      />
    </p>
  </div>

  <div class="input-group">
    <p>
      <label for="expected-return">Expected Return per year (%)</label>
      <input
        id="expected-return"
        name="expected-return"
        type="number"
        [(ngModel)]="expectReturn"
      />
    </p>
    <p>
      <label for="duration">Duration in years</label>
      <input
        id="duration"
        name="duration"
        type="number"
        [(ngModel)]="duration"
      />
    </p>
  </div>
  <p>
    <button type="submit">Calculate</button>
  </p>
</form>
